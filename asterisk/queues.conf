; Очереди секторов. Время ожидания и время звонка сотруднику — в extensions.conf
; (меняются из панели через AstDB). Лимит ожидающих — maxlen ниже: только очередь проверяет
; его надёжно, когда звонки приходят одновременно. Сервис меняет его правкой этого файла
; и командой «queue reload parameters», звонки при этом не прерываются.

[general]
persistentmembers=no

[sector-defaults](!)
strategy=ringall
; Сколько звонить участнику, решает Dial в [sector-phone] (настройка ring_time).
; timeout здесь — только верхняя граница одного дозвона.
timeout=120
timeoutpriority=conf
retry=3
wrapuptime=3
ringinuse=no
maxlen=2
joinempty=yes
leavewhenempty=no
announce-frequency=60
announce-holdtime=no
announce-position=limit
announce-position-limit=1
queue-youarenext=/var/lib/asterisk/phrases/queue_first
queue-thankyou=/var/lib/asterisk/phrases/queue_wait
musicclass=default

[q1](sector-defaults)
member => Local/1@sector-phone/n

[q2](sector-defaults)
member => Local/2@sector-phone/n

[q3](sector-defaults)
member => Local/3@sector-phone/n

[q4](sector-defaults)
member => Local/4@sector-phone/n

[q5](sector-defaults)
member => Local/5@sector-phone/n
