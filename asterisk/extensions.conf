; Сценарий звонков станции SAVT.
;
; Настройки, которые меняются из панели, станция читает из своей встроенной базы (AstDB):
;   раздел savt           — параметры (список и значения по умолчанию в [sub-load-settings]);
;   раздел savt-blacklist — чёрный список, ключ = номер только цифрами;
;   раздел savt-holiday   — нерабочие дни, ключ = дата ГГГГММДД.
; Пишет туда сервис телефонии. Если ключа нет, берётся значение по умолчанию из этого файла,
; поэтому станция работает и без сервиса. Значения не должны содержать «:» и «,».

[general]
static=yes
writeprotect=yes

[globals]
PHRASES=/var/lib/asterisk/phrases
RECORDINGS=/srv/recordings

; ---------------------------------------------------------------------------
; Чтение одной настройки: Gosub(sub-setting,s,1(ключ,по_умолчанию)) → ${GOSUB_RETVAL}
[sub-setting]
exten => s,1,Return(${IF(${DB_EXISTS(savt/${ARG1})}?${DB_RESULT}:${ARG2})})

; Все настройки звонка разом, в переменные канала.
[sub-load-settings]
exten => s,1,Gosub(sub-setting,s,1(work_days,mon-fri))
 same => n,Set(WORK_DAYS=${GOSUB_RETVAL})
 ; Часы работы без двоеточий: 0800-1659 значит с 08:00 до 16:59 включительно.
 same => n,Gosub(sub-setting,s,1(work_hours,0800-1659))
 same => n,Set(WH=${GOSUB_RETVAL})
 same => n,Set(WORK_HOURS=${WH:0:2}:${WH:2:2}-${WH:5:2}:${WH:7:2})
 same => n,Gosub(sub-setting,s,1(menu_tries,3))
 same => n,Set(MENU_TRIES=${GOSUB_RETVAL})
 same => n,Gosub(sub-setting,s,1(menu_timeout,6))
 same => n,Set(MENU_TIMEOUT=${GOSUB_RETVAL})
 ; Сектора: 1 Коммерческий, 2 Наладка, 3 Разработка ПО, 4 Проектирование, 5 Бухгалтерия.
 same => n,Gosub(sub-setting,s,1(default_sector,1))
 same => n,Set(DEFAULT_SECTOR=${GOSUB_RETVAL})
 same => n,Gosub(sub-setting,s,1(queue_wait,180))
 same => n,Set(QUEUE_WAIT=${GOSUB_RETVAL})
 same => n,Gosub(sub-setting,s,1(ring_time,20))
 same => n,Set(RING_TIME=${GOSUB_RETVAL})
 same => n,Gosub(sub-setting,s,1(msg_maxlen,120))
 same => n,Set(MSG_MAXLEN=${GOSUB_RETVAL})
 same => n,Gosub(sub-setting,s,1(msg_silence,5))
 same => n,Set(MSG_SILENCE=${GOSUB_RETVAL})
 same => n,Return()

; ---------------------------------------------------------------------------
; Вход с линии оператора
[from-trunk]
exten => _[+0-9].,1,Goto(reception,s,1)
exten => s,1,Goto(reception,s,1)

[reception]
exten => s,1,NoOp(Входящий звонок от ${CALLERID(num)})
 same => n,Set(NUM=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(NUM=${IF($["${NUM}" = ""]?unknown:${NUM})})
 same => n,Set(__LINKED=${CHANNEL(linkedid)})
 ; Чёрный список проверяем до ответа: канал оператора не занимается.
 same => n,GotoIf(${DB_EXISTS(savt-blacklist/${NUM})}?blocked)
 same => n,Gosub(sub-load-settings,s,1)
 same => n,UserEvent(SavtCall,Stage: start,Linkedid: ${LINKED},Number: ${NUM})
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf(${DB_EXISTS(savt-holiday/${STRFTIME(${EPOCH},Europe/Minsk,%Y%m%d)})}?closed)
 same => n,GotoIfTime(${WORK_HOURS},${WORK_DAYS},*,*,Europe/Minsk?open)
 same => n(closed),UserEvent(SavtCall,Stage: afterhours,Linkedid: ${LINKED})
 same => n,Playback(${PHRASES}/after_hours)
 same => n,Goto(leavemsg,s,1)
 same => n(open),Set(TRIES=0)
 same => n(menu),Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES} > ${MENU_TRIES}]?default)
 same => n,Background(${PHRASES}/greeting)
 same => n,WaitExten(${MENU_TIMEOUT})
 same => n,Goto(t,1)
 same => n(default),UserEvent(SavtCall,Stage: menu_default,Linkedid: ${LINKED})
 same => n,Set(SECT=${DEFAULT_SECTOR})
 same => n,Goto(sector,s,1)
 same => n(blocked),UserEvent(SavtCall,Stage: blocked,Linkedid: ${LINKED},Number: ${NUM})
 same => n,Hangup(21)

exten => _[1-5],1,Set(SECT=${EXTEN})
 same => n,Goto(sector,s,1)

exten => i,1,Playback(${PHRASES}/invalid)
 same => n,Goto(s,menu)

exten => t,1,Playback(${PHRASES}/timeout)
 same => n,Goto(s,menu)

; ---------------------------------------------------------------------------
; Сектор: очередь на рабочий телефон сектора
[sector]
exten => s,1,UserEvent(SavtCall,Stage: sector,Linkedid: ${LINKED},Sector: ${SECT})
 same => n,Gosub(sub-department-route,s,1(${SECT}))
 same => n,Set(DEPARTMENT_WAIT=${CUT(GOSUB_RETVAL,^,4)})
 same => n,Set(DEPARTMENT_BUSY=${CUT(GOSUB_RETVAL,^,3)})
 same => n,ExecIf($["${DEPARTMENT_WAIT}" != "" & "${DEPARTMENT_WAIT}" != "0"]?Set(QUEUE_WAIT=${DEPARTMENT_WAIT}))
 ; queue — ждать в очереди; message — один дозвон, не ответили → сообщение.
 same => n,Gosub(sub-setting,s,1(sector_${SECT}_busy,queue))
 same => n,Set(SECTOR_BUSY=${IF($["${DEPARTMENT_BUSY}" = ""]?${GOSUB_RETVAL}:${DEPARTMENT_BUSY})})
 same => n,ExecIf($["${SECTOR_BUSY}" = "message"]?Set(QUEUE_WAIT=${RING_TIME}))
 same => n,Set(SECTOR_QUEUE_OPTIONS=${IF($["${SECTOR_BUSY}" = "message"]?n:)})
 same => n,Playback(${PHRASES}/transfer)
 ; Запись: общий файл, клиент и сотрудник отдельно. Пишется только сам разговор
 ; (флаг b), без меню и музыки ожидания.
 same => n,Set(REC=${RECORDINGS}/calls/${STRFTIME(${EPOCH},Europe/Minsk,%Y%m%d-%H%M%S)}-${NUM}-${UNIQUEID})
 same => n,MixMonitor(${REC}.wav,br(${REC}-client.wav)t(${REC}-staff.wav))
 same => n,UserEvent(SavtRecording,Linkedid: ${LINKED},Sector: ${SECT},File: ${REC})
 ; Лимит ожидающих — maxlen в queues.conf: очередь проверяет его атомарно, при переполнении
 ; Queue сразу возвращает QUEUESTATUS=FULL.
 same => n,Queue(q${SECT},${SECTOR_QUEUE_OPTIONS},,,${QUEUE_WAIT})
 ; Сюда попадаем, только если разговора не было: ожидание вышло или очередь недоступна.
 same => n,UserEvent(SavtCall,Stage: queue_exit,Linkedid: ${LINKED},Status: ${QUEUESTATUS})
 same => n,Playback(${PHRASES}/queue_full)
 same => n,Goto(leavemsg,s,1)

; Вызов рабочего телефона сектора. Участник очереди qN — Local/N@sector-phone.
[sector-phone]
exten => _[1-5],1,Gosub(sub-setting,s,1(sector_${EXTEN}_target,PJSIP/10${EXTEN}))
 same => n,Set(TARGET=${GOSUB_RETVAL})
 same => n,Gosub(sub-department-route,s,1(${EXTEN}))
 same => n,Set(DEPARTMENT_NUMBER=${CUT(GOSUB_RETVAL,^,2)})
 same => n,Gosub(sub-setting,s,1(outbound_trunk,))
 same => n,ExecIf($["${DEPARTMENT_NUMBER}" != "" & "${GOSUB_RETVAL}" != ""]?Set(TARGET=PJSIP/${DEPARTMENT_NUMBER}@${GOSUB_RETVAL}))
 ; Для журнала: на какой телефон звоним (кто ответил, станет видно по этому событию).
 same => n,UserEvent(SavtRing,Linkedid: ${CHANNEL(linkedid)},Sector: ${EXTEN},Target: ${TARGET})
 same => n,Gosub(sub-setting,s,1(ring_time,20))
 same => n,Dial(${TARGET},${GOSUB_RETVAL})
 same => n,Hangup()

; Все пять слотов сохраняются в AstDB одним действием. Пустой слот обозначен «-».
[sub-department-route]
exten => s,1,Gosub(sub-setting,s,1(department_routes,-|-|-|-|-))
 same => n,Return(${CUT(GOSUB_RETVAL,|,${ARG1})})

; ---------------------------------------------------------------------------
; Сообщение клиента (нерабочее время, очередь заполнена, ожидание вышло)
[leavemsg]
exten => s,1,StopMixMonitor()
 same => n,Set(MSG=${RECORDINGS}/messages/${STRFTIME(${EPOCH},Europe/Minsk,%Y%m%d-%H%M%S)}-${NUM}-${UNIQUEID}.wav)
 same => n,UserEvent(SavtMessage,Linkedid: ${LINKED},Number: ${NUM},File: ${MSG})
 same => n,Record(${MSG},${MSG_SILENCE},${MSG_MAXLEN},k)
 same => n,Playback(${PHRASES}/thank_you)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Внутренние телефоны
[from-internal]
exten => *43,1,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

exten => _10[1-5],1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Позвонить «как клиент» с внутреннего номера
exten => 777,1,Goto(reception,s,1)

; Контекст для учётных записей сотрудников с разрешённой внешней связью.
[from-staff]
include => from-internal
exten => _+Z.,1,Set(NUM=${FILTER(0-9,${EXTEN})})
 same => n,GotoIf($[${LEN(${NUM})} + 1 != ${LEN(${EXTEN})} | ${LEN(${NUM})} > 15]?invalid)
 same => n,Gosub(sub-setting,s,1(outbound_trunk,))
 same => n,Set(TRUNK=${GOSUB_RETVAL})
 same => n,GotoIf($["${TRUNK}" = ""]?unavailable)
 same => n,Set(STAFF=${CHANNEL(endpoint)})
 same => n,Gosub(sub-setting,s,1(staff_${STAFF}_sector,))
 same => n,Set(SECT=${GOSUB_RETVAL})
 same => n,Set(__LINKED=${CHANNEL(linkedid)})
 same => n,UserEvent(SavtCall,Stage: outgoing_start,Linkedid: ${LINKED},Number: +${NUM},Staff: PJSIP/${STAFF},Sector: ${SECT})
 same => n,Gosub(sub-setting,s,1(outbound_caller_id,))
 same => n,ExecIf($["${GOSUB_RETVAL}" != ""]?Set(CALLERID(num)=${GOSUB_RETVAL}))
 same => n,Set(REC=${RECORDINGS}/calls/${STRFTIME(${EPOCH},Europe/Minsk,%Y%m%d-%H%M%S)}-${NUM}-${UNIQUEID})
 ; На исходящем канале r — сотрудник, t — клиент.
 same => n,MixMonitor(${REC}.wav,br(${REC}-staff.wav)t(${REC}-client.wav))
 same => n,UserEvent(SavtRecording,Linkedid: ${LINKED},File: ${REC})
 same => n,Dial(PJSIP/+${NUM}@${TRUNK},30)
 same => n,Hangup()
 same => n(invalid),Hangup(28)
 same => n(unavailable),Hangup(34)
