; SIP: транспорт и шаблоны. Учётные записи телефонов — в pjsip_users.conf
; (создаётся на сервере, в репозитории его нет: там пароли), линия оператора — в pjsip_trunk.conf.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[phone-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[phone-auth](!)
type=auth
auth_type=userpass

[phone-aor](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

#include pjsip_users.conf
#include pjsip_trunk.conf
