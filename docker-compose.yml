services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TELEPHONY_DB_NAME:-telephony}
      POSTGRES_USER: ${TELEPHONY_DB_USER:-telephony}
      POSTGRES_PASSWORD: ${TELEPHONY_DB_PASSWORD:?задайте TELEPHONY_DB_PASSWORD в .env}
      TZ: UTC
    ports:
      # Только на самой машине: Docker обходит ufw, порт наружу публиковать нельзя.
      - "127.0.0.1:${TELEPHONY_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Сеть хоста: Asterisk стоит на самой машине и отдаёт AMI только на 127.0.0.1.
    # Сервис слушает 127.0.0.1:8000, наружу его позже выпустит nginx.
    network_mode: host
    # Записи пишет Asterisk (группа asterisk). Сервис читает их для фронта и удаляет
    # пустые и просроченные, поэтому входит в эту группу.
    group_add:
      - "${TELEPHONY_ASTERISK_GID:-65534}"
    volumes:
      - "${TELEPHONY_RECORDINGS_DIR:-/srv/recordings}:/srv/recordings"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
